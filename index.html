<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FlashMaster · Study anything from a Google Sheet</title>
  <meta name="description" content="Free flashcards, adaptive Learn mode, practice tests and a Match game for any Google Sheet. No sign-up.">
  <meta name="theme-color" content="#0e1020">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='40' height='40' rx='9' fill='%235b4fe0'/%3E%3Crect x='18' y='6' width='40' height='40' rx='9' fill='%238b7dff'/%3E%3Cpath d='M32 18l-6 13h7l-3 11 11-15h-7l4-9z' fill='%23fff'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash. Dark is the default.
    try { var s = JSON.parse(localStorage.getItem('fm:settings') || '{}'); document.documentElement.dataset.theme = s.theme === 'light' ? 'light' : 'dark'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="FlashMaster home">
      <span class="brand-mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 64 64"><rect x="6" y="14" width="40" height="40" rx="9" fill="#5b4fe0"/><rect x="18" y="6" width="40" height="40" rx="9" fill="#8b7dff"/><path d="M32 18l-6 13h7l-3 11 11-15h-7l4-9z" fill="#fff"/></svg>
      </span>
      <span class="brand-name">FlashMaster</span>
    </a>
    <div class="topbar-actions">
      <button id="streak-btn" class="streak-btn" type="button" aria-label="Daily goal"></button>
      <button id="keys-btn" class="icon-btn hide-touch" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"></button>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch theme"></button>
    </div>
  </header>

  <main id="view" class="view" aria-live="off"></main>

  <footer class="footer">
    <span>Made by <a href="https://aruneshmishra.github.io/" target="_blank" rel="noopener">Arunesh Mishra</a></span>
    <span aria-hidden="true">·</span>
    <span>Your progress stays on this device</span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">FlashMaster needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
